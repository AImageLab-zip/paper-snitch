events {
    worker_connections 1024;
}

http {
    include mime.types;
    types { application/manifest+json webmanifest; }
    default_type application/octet-stream;

    server_tokens off;
    charset utf-8;
    client_max_body_size 50M;

    # Resolve django-web-prod through Docker DNS at request time, so recreating
    # the container (new IP) doesn't leave nginx proxying to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $host $django_upstream { default django-web-prod:8000; }

    # ================= HTTP (80) - All Domains =================
    # You can keep this as one block since it just redirects and handles Let's Encrypt
    server {
        listen 80;
        server_name paper-snitch.online www.paper-snitch.online paper-snitch.ing.unimore.it www.paper-snitch.ing.unimore.it paper-snitch.unimore.it;

        # ACME challenge (Let’s Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================= HTTPS (443) - UNIMORE Domain =================
    server {
        listen 443 ssl;
        http2 on;
        server_name paper-snitch.ing.unimore.it www.paper-snitch.ing.unimore.it;

        # Certificate for UNIMORE
        ssl_certificate     /etc/letsencrypt/live/paper-snitch.ing.unimore.it/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paper-snitch.ing.unimore.it/privkey.pem;

        # Static files
        location = /favicon.ico {
            alias /static/img/favicon.ico;
            expires 7d;
            access_log off;
        }

        location /static/ {
            alias /static/;
            expires 7d;
            access_log off;
        }

        # media files
        location /media/ {
            alias /media/; 
            access_log off;
        }

        # Django app
        location / {
            proxy_pass http://$django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ================= HTTPS (443) - ONLINE Domain =================
    server {
        listen 443 ssl;
        http2 on;
        server_name paper-snitch.online www.paper-snitch.online;

        # Certificate for ONLINE domain
        ssl_certificate     /etc/letsencrypt/live/paper-snitch.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paper-snitch.online/privkey.pem;

        # Static files
        location = /favicon.ico {
            alias /static/img/favicon.ico;
            expires 7d;
            access_log off;
        }

        location /static/ {
            alias /static/;
            expires 7d;
            access_log off;
        }

        # media files
        location /media/ {
            alias /media/; 
            access_log off;
        }

        # Django app
        location / {
            proxy_pass http://$django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ================= HTTPS (443) - UNIMORE (no ing) Domain =================
    server {
        listen 443 ssl;
        http2 on;
        server_name paper-snitch.unimore.it;

        ssl_certificate     /etc/letsencrypt/live/paper-snitch.unimore.it/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paper-snitch.unimore.it/privkey.pem;

        location = /favicon.ico {
            alias /static/img/favicon.ico;
            expires 7d;
            access_log off;
        }

        location /static/ {
            alias /static/;
            expires 7d;
            access_log off;
        }

        location /media/ {
            alias /media/;
            access_log off;
        }

        location / {
            proxy_pass http://$django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
