<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26419.286416459698 1856.1425786567652" width="79257.8592493791" height="5568.4277359702955"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Nunito; src: url(data:font/woff2;base64,); }</style></defs><g transform="translate(10 10) rotate(0 13199.643208229849 918.0712893283826)"><text x="13199.643208229849" y="467.11467201028074" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="489.63802097513707px" fill="#000000" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">PaperSnitch screens papers for reproducibility at review time. It reads the PDF, checks that the linked repository exists</text><text x="13199.643208229849" y="1079.1621982292022" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="489.63802097513707px" fill="#000000" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">and actually contains code, and returns a 0–100 verifiability score where every verdict points to evidence in the paper. </text><text x="13199.643208229849" y="1691.2097244481233" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="489.63802097513707px" fill="#000000" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">It never runs untrusted code: the reviewer decides.</text></g></svg>