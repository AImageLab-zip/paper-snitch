{% extends "base.html" %}

{% block head_title %}Reset your password{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-key"></i> Reset your password</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <p class="text-muted small">Enter your email and we will send you a link to choose a new password.</p>
                        <div class="form-group">
                            <label for="id_email">Email</label>
                            <input type="email" name="email" id="id_email" class="form-control" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
