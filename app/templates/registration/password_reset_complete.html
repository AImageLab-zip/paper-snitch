{% extends "base.html" %}

{% block head_title %}Password changed{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-check"></i> Password changed</h4>
                </div>
                <div class="card-body">
                    <p>Your password has been set.</p>
                    <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
